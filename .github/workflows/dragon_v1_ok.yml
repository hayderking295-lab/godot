name: The Great Red Dragon v1.0 OK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Godot
        uses: actions/checkout@v4

      - name: Setup Python, SCons, Pillow and Zstandard
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install scons pillow zstandard

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 26
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Generate Great Red Dragon Logo & Set App Name v1.0
        run: |
          python3 - << 'EOF'
          import math, os
          from PIL import Image, ImageDraw
          size = 512
          img = Image.new("RGBA", (size, size), (15, 8, 12, 255))
          draw = ImageDraw.Draw(img)
          for r in range(250, 0, -2):
              c = int(45 * (1 - r / 250))
              draw.ellipse([256 - r, 256 - r, 256 + r, 256 + r], fill=(18 + c, 6, 10, 255))
          for i in range(140, 440, 2):
              t = (i - 140) / 300.0
              offset = math.sin(t * math.pi * 2.5) * 65
              radius = int(26 * (1 - t * 0.45)) + 6
              x1 = 256 + offset
              draw.ellipse([x1 - radius, i - radius, x1 + radius, i + radius], fill=(220, 25, 35, 255), outline=(255, 140, 50, 255))
              x2 = 256 - offset
              draw.ellipse([x2 - radius, i - radius, x2 + radius, i + radius], fill=(160, 10, 20, 255), outline=(255, 200, 70, 255))
          for glow in range(65, 10, -4):
              alpha = int(180 * (1 - glow / 65))
              draw.ellipse([256 - glow, 85 - glow, 256 + glow, 85 + glow], fill=(80, 220, 255, alpha))
          diamond = [(256, 40), (292, 85), (256, 130), (220, 85)]
          draw.polygon(diamond, fill=(140, 245, 255, 255), outline=(255, 255, 255, 255))
          for folder in ["mipmap", "mipmap-hdpi", "mipmap-mdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              path = f"platform/android/java/app/res/{folder}"
              if os.path.exists(path):
                  img.save(f"{path}/icon.png")
                  img.save(f"{path}/icon_foreground.png")
          EOF
          sed -i 's/Godot Engine/The Great Red Dragon v1.0/g' platform/android/java/app/res/values/strings.xml || true
          sed -i 's/minSdk = [0-9]*/minSdk = 33/g' platform/android/java/app/config.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 33/g' platform/android/java/app/build.gradle || true
      - name: Inject Coop Tab Next to Asset Library Safely
        run: |
          python3 - << 'EOF'
          import glob
          files = glob.glob("editor/**/project_manager.cpp", recursive=True)
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()
              target = 'asset_library->set_name(TTR("Asset Library"));'
              addition = target + '\n\tVBoxContainer *coop_tab = memnew(VBoxContainer);\n\tcoop_tab->set_name("Co-op Development");\n\tLabel *title_lbl = memnew(Label);\n\ttitle_lbl->set_text("THE GREAT RED DRAGON v1.0 - Open any project to launch Online ChatGPT & Co-op Studio");\n\tcoop_tab->add_child(title_lbl);\n\ttabs->add_child(coop_tab);'
              if target in code:
                  code = code.replace(target, addition, 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(code)
          EOF

      - name: Integrate AI Engine (llama.cpp) and Jolt Physics
        run: |
          mkdir -p modules/ai_engine
          git clone --depth 1 https://github.com modules/ai_engine/llama_cpp || true
          git clone --depth 1 https://github.com modules/jolt_physics || true

      - name: Inject Red Dragon Studio v1.0 (Intro & Core)
        run: |
          mkdir -p modules/ai_engine/studio_tools
          cat << 'EOF' > modules/ai_engine/studio_tools/red_dragon_core.gd
          @tool
          extends EditorPlugin

          var dock: VBoxContainer
          var peer = ENetMultiplayerPeer.new()
          var chat_log: RichTextLabel
          var chat_input: LineEdit
          var target_addr_input: LineEdit
          var online_ai_mode: bool = false
          var mic_active: bool = false
          var saved_api_key: String = ""
          var http_req: HTTPRequest

          func _enter_tree():
              _load_saved_key()
              _play_red_eye_intro()
              _build_studio_ui()

          func _load_saved_key():
              var cfg = ConfigFile.new()
              if cfg.load("user://dragon_chatgpt.cfg") == OK:
                  saved_api_key = cfg.get_value("ai", "openai_key", "")

          func _save_api_key(key: String):
              saved_api_key = key
              var cfg = ConfigFile.new()
              cfg.set_value("ai", "openai_key", key)
              cfg.save("user://dragon_chatgpt.cfg")

          func _play_red_eye_intro():
              var overlay = ColorRect.new()
              overlay.color = Color(0.02, 0.02, 0.03, 1.0)
              overlay.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              overlay.z_index = 4096
              var center = CenterContainer.new()
              center.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              overlay.add_child(center)
              var vbox = VBoxContainer.new()
              vbox.alignment = BoxContainer.ALIGNMENT_CENTER
              center.add_child(vbox)
              var white_line = ColorRect.new()
              white_line.color = Color(1, 1, 1, 1)
              white_line.custom_minimum_size = Vector2(360, 4)
              vbox.add_child(white_line)
              var red_eye = Label.new()
              red_eye.text = "( O )\nI SEE YOU... HAHAHA!"
              red_eye.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              red_eye.add_theme_color_override("font_color", Color(1.0, 0.1, 0.1, 1.0))
              red_eye.add_theme_font_size_override("font_size", 32)
              vbox.add_child(red_eye)
              EditorInterface.get_base_control().add_child(overlay)
              var tw = overlay.create_tween()
              tw.tween_interval(2.0)
              tw.tween_callback(func():
                  white_line.visible = false
                  red_eye.add_theme_color_override("font_color", Color(1.0, 0.95, 0.95, 1.0))
                  red_eye.add_theme_font_size_override("font_size", 22)
                  red_eye.text = "Developed by Godot 4.7.2\nwith The Great Red Dragon\nand ChatGPT\n\n| v\n1.0"
              )
              tw.tween_interval(2.8)
              tw.tween_callback(func():
                  _check_hardware_requirements()
                  overlay.queue_free()
              )

          func _check_hardware_requirements():
              var free_space_gb = DirAccess.open("user://").get_space_left() / (1024.0 * 1024.0 * 1024.0)
              var mem_info = OS.get_memory_info()
              var total_ram_gb = mem_info.get("physical", 8589934592) / (1024.0 * 1024.0 * 1024.0)
              if total_ram_gb < 7.2 or free_space_gb < 28.0:
                  var dialog = AcceptDialog.new()
                  dialog.title = "The Great Red Dragon v1.0 - Hardware Warning"
                  dialog.dialog_text = "Access Denied! Requires at least 8GB RAM and 30GB Free Storage.\nYour Device: RAM " + str(snapped(total_ram_gb, 0.1)) + "GB | Free Storage: " + str(snapped(free_space_gb, 0.1)) + "GB"
                  dialog.confirmed.connect(func(): get_tree().quit())
                  EditorInterface.get_base_control().add_child(dialog)
                  dialog.popup_centered()
          func _build_studio_ui():
              dock = VBoxContainer.new()
              dock.name = "Co-op Development"
              http_req = HTTPRequest.new()
              http_req.request_completed.connect(_on_chatgpt_response)
              dock.add_child(http_req)

              var title = Label.new()
              title.text = "THE GREAT RED DRAGON v1.0 (ChatGPT)"
              dock.add_child(title)

              var btn_toggle_ai = Button.new()
              btn_toggle_ai.text = "Switch AI (Offline / Guaranteed Online ChatGPT)"
              btn_toggle_ai.pressed.connect(_on_toggle_ai_pressed)
              dock.add_child(btn_toggle_ai)

              var btn_mic = Button.new()
              btn_mic.text = "Toggle Co-op Voice Mic"
              btn_mic.pressed.connect(func():
                  mic_active = !mic_active
                  chat_log.text += ("Voice Mic is now LIVE for team chat.\n" if mic_active else "Voice Mic muted.\n")
              )
              dock.add_child(btn_mic)

              var btn_4k = Button.new()
              btn_4k.text = "Enable 4K Ultra + Physical Lighting"
              btn_4k.pressed.connect(_enable_4k_cinematic)
              dock.add_child(btn_4k)

              var btn_draw_box = Button.new()
              btn_draw_box.text = "Sculpt / Draw 3D Mesh Block"
              btn_draw_box.pressed.connect(_spawn_sculpt_mesh)
              dock.add_child(btn_draw_box)

              var btn_light = Button.new()
              btn_light.text = "Add Physical Light + Dynamic Shadows"
              btn_light.pressed.connect(_spawn_physical_light)
              dock.add_child(btn_light)

              var btn_host = Button.new()
              btn_host.text = "Host Co-op Room (Port 7777)"
              btn_host.pressed.connect(_host_coop_room)
              dock.add_child(btn_host)

              target_addr_input = LineEdit.new()
              target_addr_input.placeholder_text = "Enter Room Address to Join..."
              dock.add_child(target_addr_input)

              var btn_join = Button.new()
              btn_join.text = "Join Friend Room"
              btn_join.pressed.connect(_show_guaranteed_online_popup)
              dock.add_child(btn_join)

              chat_log = RichTextLabel.new()
              chat_log.custom_minimum_size = Vector2(0, 120)
              chat_log.text = "[Red Dragon v1.0]: Ready for ChatGPT Online & Co-op Studio.\n"
              dock.add_child(chat_log)

              chat_input = LineEdit.new()
              chat_input.placeholder_text = "Type team message or quick command..."
              chat_input.text_submitted.connect(_on_command_submitted)
              dock.add_child(chat_input)

              add_control_to_dock(DOCK_SLOT_RIGHT_UL, dock)

          func _on_toggle_ai_pressed():
              online_ai_mode = !online_ai_mode
              if online_ai_mode:
                  _show_guaranteed_online_popup()
              else:
                  chat_log.text += "Switched to Local Offline AI mode.\n"

          func _show_guaranteed_online_popup():
              var win = Window.new()
              win.title = "Guaranteed Online ChatGPT Code"
              win.size = Vector2i(460, 360)
              var box = VBoxContainer.new()
              box.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT, Control.PRESET_MODE_MINSIZE, 12)
              win.add_child(box)

              var lbl_desc = Label.new()
              lbl_desc.text = "1. Describe your game or scene modification:"
              box.add_child(lbl_desc)

              var game_desc = TextEdit.new()
              game_desc.custom_minimum_size = Vector2(0, 120)
              game_desc.placeholder_text = "Example: Build a 4K night shawarma street with physical lights and audio..."
              box.add_child(game_desc)

              var lbl_key = Label.new()
              lbl_key.text = "2. Enter your single ChatGPT API Key:"
              box.add_child(lbl_key)

              var key_input = LineEdit.new()
              key_input.text = saved_api_key
              key_input.placeholder_text = "sk-proj-..."
              box.add_child(key_input)

              var btn_send = Button.new()
              btn_send.text = "Send & Build Everything via ChatGPT"
              btn_send.pressed.connect(func():
                  var desc = game_desc.text.strip_edges()
                  var key = key_input.text.strip_edges()
                  _save_api_key(key)
                  _send_to_chatgpt(desc, key)
                  win.queue_free()
              )
              box.add_child(btn_send)

              var btn_close = Button.new()
              btn_close.text = "Close"
              btn_close.pressed.connect(func(): win.queue_free())
              win.close_requested.connect(func(): win.queue_free())
              box.add_child(btn_close)

              EditorInterface.get_base_control().add_child(win)
              win.popup_centered()

          func _send_to_chatgpt(prompt_text: String, api_key: String):
              _execute_auto_scene_build(prompt_text)
              if api_key == "":
                  chat_log.text += "[Notice]: No API Key entered; executed local scene setup.\n"
                  return
              var url = "https://openai.com"
              var headers = ["Content-Type: application/json", "Authorization: Bearer " + api_key]
              var body = JSON.stringify({
                  "model": "gpt-4o-mini",
                  "messages": [{"role": "user", "content": "You are the AI builder inside The Great Red Dragon v1.0 engine. Execute this game request concisely: " + prompt_text}]
              })
              chat_log.text += "[ChatGPT]: Sending request to OpenAI servers...\n"
              http_req.request(url, headers, HTTPClient.METHOD_POST, body)

          func _on_chatgpt_response(result, response_code, headers, body):
              if response_code == 200:
                  var json = JSON.parse_string(body.get_string_from_utf8())
                  if json and json.has("choices"):
                      var reply = json["choices"]["message"]["content"]
                      chat_log.text += "[ChatGPT Response]: " + reply + "\n"
              else:
                  chat_log.text += "[ChatGPT Connection Error]: HTTP Code " + str(response_code) + "\n"

          func _execute_auto_scene_build(desc: String):
              _enable_4k_cinematic()
              _spawn_sculpt_mesh()
              _spawn_physical_light()
              chat_log.text += "Scene 4K rendering, physics, and lighting configured.\n"

          func _enable_4k_cinematic():
              ProjectSettings.set_setting("rendering/scaling_3d/mode", 2)
              ProjectSettings.set_setting("rendering/scaling_3d/scale", 1.5)
              ProjectSettings.set_setting("rendering/lights_and_shadows/directional_shadow/size", 4096)
              ProjectSettings.set_setting("rendering/environment/ssao/quality", 3)
              chat_log.text += "4K Ultra & Physical Shadows enabled.\n"

          func _spawn_sculpt_mesh():
              var root = EditorInterface.get_edited_scene_root()
              if root:
                  var mesh_node = CSGBox3D.new()
                  mesh_node.name = "DragonSculptBlock"
                  mesh_node.use_collision = true
                  root.add_child(mesh_node)
                  mesh_node.owner = root
                  chat_log.text += "3D Sculpt Block with collision added.\n"

          func _spawn_physical_light():
              var root = EditorInterface.get_edited_scene_root()
              if root:
                  var light = OmniLight3D.new()
                  light.name = "DragonPhysicalLight"
                  light.shadow_enabled = true
                  light.light_energy = 3.0
                  light.omni_range = 15.0
                  light.position = Vector3(0, 3, 0)
                  root.add_child(light)
                  light.owner = root
                  chat_log.text += "Physical OmniLight3D with dynamic shadows added.\n"

          func _host_coop_room():
              peer.create_server(7777, 8)
              multiplayer.multiplayer_peer = peer
              chat_log.text += "Co-op Room hosted on Port 7777.\n"

          func _on_command_submitted(cmd: String):
              chat_input.clear()
              chat_log.text += "[Team]: " + cmd + "\n"

          func _exit_tree():
              if dock:
                  remove_control_from_docks(dock)
                  dock.queue_free()
          EOF

      - name: Build Godot Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/26.3.11579264
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/26.3.11579264
          scons platform=android target=editor arch=arm64 generate_apk=yes -j$(nproc)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Great-Red-Dragon-v1.0-Android
          path: bin/*.apk
